<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام تقارير صيانة العيادات</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--m:#990000;--d:#6E0000;--z:#FBE4E4;--bg:#f6f1e7;--line:#d9c9a8;--ink:#2b1b12}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:Arial,'Segoe UI',Tahoma,sans-serif;color:var(--ink);direction:rtl}
.top{background:linear-gradient(135deg,var(--m),var(--d));color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{height:44px;background:#fff;border-radius:6px;padding:2px}
.top h1{margin:0;font-size:18px}.top small{opacity:.85;display:block;font-size:12px}
.tabs{display:flex;gap:4px;padding:8px 12px 0;flex-wrap:wrap;background:#efe6d3;border-bottom:2px solid var(--m)}
.tab{border:0;background:#e2d5ba;color:var(--d);padding:9px 16px;border-radius:8px 8px 0 0;font:700 14px Arial;cursor:pointer}
.tab.on{background:var(--m);color:#fff}
main{max-width:1200px;margin:0 auto;padding:14px}
.card{background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;color:var(--d)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select,input,textarea{font:14px Arial;padding:7px 9px;border:1px solid #c9b88f;border-radius:7px;background:#fff;color:var(--ink)}
input[type=number]{width:70px}
.btn{font:700 13px Arial;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;background:var(--m);color:#fff}
.btn.s{background:#fff;color:var(--m);border:1px solid var(--m)}.btn.g{background:#1f7a46}.btn.x{background:#b00020}
.btn.sm{padding:5px 10px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.kpi{background:var(--z);border-radius:10px;text-align:center;overflow:hidden;border:1px solid #e8b8b8}
.kpi b{display:block;background:var(--m);color:#fff;font-size:12px;padding:5px}.kpi span{display:block;font-size:26px;font-weight:700;color:var(--d);padding:6px}
table{border-collapse:collapse;width:100%}
th{background:var(--m);color:#fff;padding:7px 6px;font-size:12px;border:1px solid #fff}
td{border:1px solid #cfcfcf;padding:5px 7px;font-size:13px;text-align:center}
td.r{text-align:right}tr.z td{background:var(--z)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.u{border:2px solid #ddd;border-radius:10px;padding:8px;cursor:pointer;background:#fff;text-align:center}
.u b{font-size:16px;display:block}.u small{color:#666;display:block}.u i{font-style:normal;font-size:11px;display:block;margin-top:3px;padding:2px 4px;border-radius:10px}
.u.ok{border-color:#2e9e5b}.u.ok i{background:#dff5e6;color:#1f7a46}
.u.bad{border-color:var(--m)}.u.bad i{background:var(--z);color:var(--d)}
.u.fixed{border-color:#2166c4}.u.fixed i{background:#e1ecfb;color:#154a8f}.u.partial{border-color:#e8862a}.u.partial i{background:#fff0dd;color:#9a5410}
.u.new{border-color:#c2410c}.u.new i{background:#ffe3d1;color:#9a3a08}.fc.new{border-color:#c2410c;background:#ffe3d1;color:#9a3a08}.qt tr.s-new td.n{background:#ffe3d1}.u.no{border-color:#e0a800}.u.no i{background:#fff3cd;color:#856404}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.modal.on{display:flex}.box{background:#fff;border-radius:12px;max-width:1000px;width:100%;padding:16px}.box .mt{overflow-x:auto}.box table input{max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:var(--z);border:1px solid #e0a0a0;border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--d)}
.chip:hover{background:var(--m);color:#fff}
.warn{background:#fff3cd;border:1px solid #e0c060;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12px}.bar div.t{width:260px;text-align:right}.bar div.f{background:var(--m);height:16px;border-radius:3px;min-width:2px}
.hint{font-size:12px;color:#7a6a50}
/* ---------- print sheet ---------- */
.sheet{background:#fff;padding:10px 14px;border:1px solid var(--line);margin-bottom:16px}
.lh{display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--m);padding-bottom:6px;margin-bottom:8px}
.lh img{height:56px}.lh h3{margin:0;color:var(--d);font-size:17px}.lh p{margin:2px 0 0;color:#555;font-size:12px}
.ttl{display:flex;justify-content:space-between;font-weight:700;color:var(--d);font-size:15px;margin:6px 0}
.sheet table th{background:var(--m)}.sheet td{font-size:12px;padding:3px 5px}
.sheet tr{page-break-inside:avoid}
.cmp td.ul{padding:2px 6px;font-size:10px}.ulr{display:flex;direction:rtl;gap:8px;align-items:baseline;line-height:1.35}.ulr+.ulr{border-top:1px dotted #d8c9a8}.ulr b{min-width:28px;text-align:center;color:#6e0000}.ulr span{flex:1;text-align:right;unicode-bidi:isolate}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}.dc{border:1px solid #d8c9a8;border-radius:10px;padding:10px 12px;background:#fff}.dc h3{margin:0 0 6px;font-size:15px}.dc .big{font-size:30px;font-weight:700}.dc .cn{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;margin:6px 0}.dc .cn span{padding:2px 7px;border-radius:10px;background:#f1e9d6}.dc .row{gap:6px;margin-top:6px}
.srcb{display:inline-block;white-space:nowrap;font-size:10px;border-radius:5px;padding:1px 6px;background:#efe7d2;color:#6b5b3a}.srcb.d{background:#dbe9fb;color:#154a8f}
.scope{display:inline-block;font-size:11px;color:#6b5b3a;background:#f6efe0;border:1px solid #e6d9b8;border-radius:6px;padding:3px 9px;margin:4px 0 6px}
.lastb{break-inside:avoid;page-break-inside:avoid}.sigtr td,.sigtr:hover td{background:#fff!important;border:0!important;padding:0}.sign{break-inside:avoid;display:flex;justify-content:space-around;margin-top:26px;font-weight:700;font-size:13px}.sign div{text-align:center;min-width:180px}.sign div::after{content:"";display:block;border-top:1px solid #444;margin-top:34px}
.pb{page-break-before:always}
#bulk{position:fixed;inset:0;background:#e9e2d0;overflow:auto;z-index:80;padding:10px;display:none}#bulk.on{display:block}
#bulk .bar2{position:sticky;top:0;z-index:5;background:#6E0000;color:#fff;padding:8px 12px;border-radius:8px;display:flex;gap:10px;align-items:center;margin-bottom:10px}
.qwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:8px;background:#fff}
.qt{border-collapse:separate;border-spacing:0;width:auto;min-width:100%}
.qt th{position:sticky;top:0;z-index:3;background:var(--m);color:#fff;font-size:13px;padding:6px 3px;min-width:56px;max-width:78px;vertical-align:bottom;border-left:1px solid #fff5}
.qt th.v span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;max-height:210px;overflow:hidden;white-space:normal;padding:2px 0;font-size:14px;font-weight:700;line-height:1.35;letter-spacing:0}
.qt td{border:1px solid #cfc6b0;padding:0;height:40px;text-align:center}.qt tbody tr:nth-child(even) td.qc:not(.on):not(.fx){background:#faf6ec}.qt td.n b{font-size:15px}
.qt td.n{position:sticky;right:0;z-index:2;background:#fff;min-width:110px;padding:2px 8px;text-align:right;font-size:13px}
.qt th.n{right:0;z-index:5;min-width:110px}
.qt td.qc{cursor:pointer;user-select:none;font-weight:700;color:#fff;font-size:20px}.qt td.qc:hover{background:#f7d9d9}
.qt td.qc.on{background:var(--m)}
.qt td.ok{cursor:pointer;font-size:12px;min-width:64px}.qt tr.s-ok td.ok{background:#dff5e6;color:#14693a;font-weight:700}.qt tr.s-bad td.n{background:var(--z)}.qc.fx{background:#cfe0fa;color:#0f3f86;font-size:16px}.qt tr.s-fixed td.n{background:#e1ecfb}.qt tr.s-partial td.n{background:#fff0dd}.qt tr.s-no td.n{background:#fff8e1}
.qt td.cur{outline:3px solid #f2a900;outline-offset:-3px;position:relative;z-index:1}
.qt td.qc.hl-c:not(.on):not(.fx){background:#fdf0d5}.qt th.hl-c{filter:brightness(.65)}.qt tr.hl-r td.n{background:#ffe9a8!important}.qt tr.hl-r td.qc:not(.on):not(.fx){background:#fdf0d5}
.qbar{height:10px;background:#e8ddc8;border-radius:6px;overflow:hidden}.qbar i{display:block;height:100%;background:#1f9d55;transition:width .3s}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;background:#f1e9d6}.seg{display:inline-flex;gap:4px}.chip.on{background:var(--m);color:#fff}
.qcard{max-width:600px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;touch-action:pan-y}.qh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qbig{display:block;width:100%;padding:16px;font:700 18px Arial;border-radius:12px;border:2px solid #1f9d55;background:#dff5e6;color:#14693a;cursor:pointer}
.qfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.qfb{position:relative;padding:14px 8px;border:2px solid #d8c9a8;border-radius:12px;background:#fff;font:700 14px Arial;cursor:pointer;min-height:58px;text-align:center;color:#333}.qfb.on{background:var(--m);color:#fff;border-color:var(--m)}.qfb.fx{background:#e1ecfb;border-color:#2166c4;color:#154a8f}
.qfb b{position:absolute;top:4px;left:6px;background:#fff;color:var(--m);border-radius:10px;padding:0 8px;font-size:14px}.qfb small{font-weight:400;opacity:.85}
.qt td.ot{min-width:60px;font-size:12px}
.fgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:8px 0}
.fc{border:2px solid #ccc;border-radius:7px;text-align:center;padding:3px 2px;font-size:10px;cursor:pointer;background:#fff}
.fc b{display:block;font-size:12px}.fc.ok{border-color:#1f9d55;background:#dff5e6;color:#14693a}.fc.fixed{border-color:#2166c4;background:#e1ecfb;color:#154a8f}
.fc.partial{border-color:#e8862a;background:#fff0dd;color:#9a5410}.fc.bad{border-color:#d6304a;background:#fbe1e4;color:#9a1f33}.fc.no{border-color:#bbb;background:#f1f1f1;color:#666}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin:4px 0}.legend span::before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:4px;vertical-align:middle;background:var(--c)}
.donuts{display:flex;gap:14px;align-items:center;justify-content:space-around;flex-wrap:wrap}.donuts figure{margin:0;text-align:center}.donuts svg{width:150px;height:150px}.donuts figcaption{font-weight:700;font-size:13px;color:var(--d)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media (max-width:800px){.two{grid-template-columns:1fr}}.cmp td,.cmp th{font-size:11px;padding:2px 4px}.cmp.big td,.cmp.big th{font-size:13px;padding:6px 8px}
body.measure .sheet.fit1{width:281mm;height:194mm;overflow:hidden;padding:0}
body.measure .two{grid-template-columns:1fr 1fr!important}body.measure .kpis{grid-template-columns:repeat(4,1fr)!important}body.measure .bar div.t{width:260px!important}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.bar div.t{width:130px}}
@media (max-width:640px){
 .top{flex-wrap:wrap;padding:8px}.top h1{font-size:16px}.top small{display:none}
 .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:6px 8px 0}.tab{white-space:nowrap;padding:10px 12px;font-size:14px}
 main{padding:6px}.card{padding:8px}.btn{padding:10px 12px;font-size:14px;min-height:40px}select,input{font-size:16px;min-height:38px}
 .sheet{overflow-x:auto}.sheet table{min-width:640px}.modal .box{width:100%!important;max-width:100%!important;margin:0!important;border-radius:0!important;min-height:100vh}
 .modal{padding:0}.qt{display:block;overflow-x:auto}.qt td,.qt th{padding:8px 6px}
 .row{gap:6px}
}
@media print{
 @page{size:A4 landscape;margin:8mm}
 body{background:#fff}.top,.tabs,.noprint,.modal{display:none!important}
 main{max-width:none;padding:0}.card{border:0;padding:0;margin:0}.sheet{border:0;margin:0;padding:0}
 .tabpane{display:none!important}.tabpane.on{display:block!important}
 html,body,main{background:#fff!important}
 body.bulkmode>*:not(#bulk){display:none!important}
 #bulk{position:static!important;inset:auto!important;overflow:visible!important;background:#fff!important;padding:0!important;display:block!important}
 #bulk .bar2{display:none!important}
 .sheet.fit1{width:281mm;height:194mm;overflow:hidden;padding:0;page-break-after:always;break-after:page;page-break-before:auto;break-before:auto}
 .sheet.fit1:last-child{page-break-after:auto;break-after:auto}
 .sheet.fit1.pb{page-break-before:always;break-before:page}
 .two{grid-template-columns:1fr 1fr!important}.kpis{grid-template-columns:repeat(4,1fr)!important}.bar div.t{width:260px!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 thead{display:table-header-group}
}
</style>
</head>

function qBatch(idx,fn,label,ty){
 const items=[];idx.forEach(i=>{const u=S.units[i],b=qsnap(u);fn(u,i);const a=qsnap(u);if(a!==b)items.push({i,b,a})});

const qMut=(i,fn,label,ty)=>qBatch([i],fn,label,ty);
function qApply(en,key){en.items.forEach(x=>{const d=JSON.parse(x[key]),u=S.units[x.i];u.ok=d.ok;u.faults=d.faults})}
function qUndo(){const e=QU.pop();if(!e)return;qApply(e,'b');QR.push(e);QLOG.push({t:Date.now(),label:'↶ تراجع: '+e.label,ty:'undo'});save();qRender(true)}
function qRedo(){const e=QR.pop();if(!e)return;qApply(e,'a');QU.push(e);QLOG.push({t:Date.now(),label:'↷ إعادة: '+e.label,ty:'redo'});save();qRender(true)}

function qCell(r,c){ui.qcur={r,c};qAct(r,c,'cycle')}
function qAct(r,c,what,n){const u=QM.us[r],x=QM.cols[c];if(!u||!x)return;const i=S.units.indexOf(u);
 if(ui.qmode==='repair'){if(what==='cycle')qFixToggle(i,x.c.fault);return}

function qMark(){
 const t=$('qtable');if(!t)return;t.querySelectorAll('.cur,.hl-r,.hl-c').forEach(e=>e.classList.remove('cur','hl-r','hl-c'));
 const m=ui.qhov||ui.qcur;if(!m)return;

function qMove(r,c,scroll){const n=QM.us.length,m=QM.cols.length;if(!n||!m)return;r=Math.max(0,Math.min(n-1,r));c=Math.max(0,Math.min(m-1,c));ui.qcur={r,c};ui.qhov=null;qMark();

document.addEventListener('keydown',e=>{
 if(ui.tab==='quick'&&e.key==='/'&&!$('modal').classList.contains('on')&&!(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))){e.preventDefault();const s=$('qusearch');if(s){s.focus();s.select()}return}
 if(ui.tab!=='quick'||ui.qview!=='grid')return;
 const tg=e.target;if(tg&&/INPUT|SELECT|TEXTAREA/.test(tg.tagName))return;
 if($('modal').classList.contains('on'))return;
 const k=e.key;
 if((e.ctrlKey||e.metaKey)&&/^[zZ]$/.test(k)){e.preventDefault();e.shiftKey?qRedo():qUndo();return}
 if((e.ctrlKey||e.metaKey)&&/^[yY]$/.test(k)){e.preventDefault();qRedo();return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(!QM.us.length||!QM.cols.length)return;
 const cur=ui.qcur||{r:0,c:0},rep=ui.qmode==='repair';
 const go=(r,c)=>{e.preventDefault();qMove(r,c)};
 if(!ui.qcur&&/^(ArrowDown|ArrowUp|ArrowRight|ArrowLeft|Enter)$/.test(k))return go(0,0);
 if(k==='ArrowDown'||k==='Enter')return go(cur.r+1,cur.c);
 if(k==='ArrowUp')return go(cur.r-1,cur.c);
 if(k==='ArrowRight')return go(cur.r,cur.c-1);
 if(k==='ArrowLeft')return go(cur.r,cur.c+1);
 if(!ui.qcur){if(/^[123 ]$|Delete|Backspace/.test(k)){e.preventDefault();qMove(0,0)}return}
 if(k===' '){e.preventDefault();qAct(cur.r,cur.c,'cycle');return}
 if(!rep&&/^[123]$/.test(k)){e.preventDefault();qAct(cur.r,cur.c,'set',+k);return}
 if(!rep&&(k==='Delete'||k==='Backspace')){e.preventDefault();qAct(cur.r,cur.c,'del');return}
 if(/^[sSسس]$/.test(k)){e.preventDefault();const u=QM.us[cur.r];if(!u)return;const i=S.units.indexOf(u);rep?qFixAll(i):qOk(i);return}
 if(/^[nNن]$/.test(k)){e.preventDefault();const f=rep?(u=>u.faults.some(x=>!x.fixed)):(u=>!u.faults.length&&!u.ok);
  for(let d=1;d<=QM.us.length;d++){const r=(cur.r+d)%QM.us.length;if(f(QM.us[r])){qMove(r,cur.c);return}}}
});

function renCat(i,v){const o=S.cat[i].fault;S.units.forEach(u=>u.faults.forEach(f=>{if(f.f===o)f.f=v}));S.cat[i].fault=v;save()}

/* ---------- data quality ---------- */
function qaIssues(){
 const U=S.units,I={nofd:[],bad:[],nocode:[],dup:[],nofdate:[],nosev:[],nopart:[],un:[]};
 U.forEach((u,i)=>{u.faults.forEach((f,j)=>{if(f.fixed&&!f.fd)I.nofd.push({i,j,u,f});if(f.fixed&&f.fd&&f.d&&f.fd<f.d)I.bad.push({i,j,u,f})});
  if(u.code==null||String(u.code).trim()==='')I.nocode.push({i,u});if(!u.faults.length&&!u.ok)I.un.push({i,u})});
 const m=new Map();U.forEach((u,i)=>{const k=u.c+'|'+String(u.code||'').trim();if(!String(u.code||'').trim())return;(m.get(k)||m.set(k,[]).get(k)).push({i,u})});
 m.forEach(v=>{if(v.length>1)I.dup.push(v)});
 S.clinics.forEach(c=>{if(!c.fdate)I.nofdate.push(c)});
 S.cat.forEach((c,i)=>{if(!c.sev)I.nosev.push({i,c});if(!c.part||c.part==='_')I.nopart.push({i,c})});
 return I}
const qaCount=I=>I.nofd.length+I.bad.length+I.nocode.length+I.dup.length+I.nosev.length;
function qaFixFD(cid,iso){if(!iso)return;let n=0;S.units.forEach(u=>{if(u.c===cid)u.faults.forEach(f=>{if(f.fixed&&!f.fd){f.fd=iso;n++}})});save();rQA();alert('اتحدد تاريخ الإصلاح لـ '+n+' عطل')}
function qaCode(i,v){S.units[i].code=v.trim();save();rQA()}
function rQA(){
 const I=qaIssues(),n=qaCount(I),sec=(ok,title,body,hint)=>`<div class="card" style="border-right:5px solid ${ok?'#1f9d55':'#d6304a'}"><h2 style="margin-top:0">${ok?'✅':'⚠'} ${title}</h2>${ok?'<p class="hint">سليم.</p>':(hint?`<p class="hint">${hint}</p>`:'')+body}</div>`;
 const byC=a=>{const m=new Map();a.forEach(x=>{const c=x.u.c;(m.get(c)||m.set(c,[]).get(c)).push(x)});return[...m]};
 $('t-qa').innerHTML=`<div class="card"><h2 style="margin-top:0">🧹 فحص جودة البيانات</h2><p style="font-size:15px">${n?`<b style="color:#d6304a">${n}</b> ملاحظة محتاجة مراجعة`:'<b style="color:#1f9d55">كل البيانات سليمة ✓</b>'} • ${S.units.length} وحدة • ${S.units.reduce((a,u)=>a+u.faults.length,0)} عطل</p></div>
 ${sec(!I.nofdate.length,'عيادات بدون تاريخ تقرير نهائي ('+I.nofdate.length+')',`<table class="cmp"><tbody>${I.nofdate.map(c=>`<tr><td><b>${esc(cLabel(c.id))}</b></td><td><input type="date" onchange="setFDate(${c.id},this.value);rQA()"></td></tr>`).join('')}</tbody></table>`,'لازم لعمل التقرير النهائي (قبل/بعد). ممكن تسيبه فاضي لو العيادة لسه في جولتها.')}
 ${sec(!I.nofd.length,'أعطال مُصلَحة بدون تاريخ إصلاح ('+I.nofd.length+')',`<table class="cmp"><tbody>${byC(I.nofd).map(([c,a])=>`<tr><td><b>${esc(cLabel(c))}</b></td><td>${a.length} عطل</td><td><input type="date" id="qafd${c}" value="${toISO((S.clinics.find(x=>x.id===c)||{}).fdate)||todayISO()}"> <button class="btn sm" onclick="qaFixFD(${c},$('qafd${c}').value)">تطبيق على الكل</button></td></tr>`).join('')}</tbody></table>`,'بدونه مينفعش نحسب زمن الإصلاح.')}
 ${sec(!I.bad.length,'تاريخ إصلاح قبل تاريخ العطل ('+I.bad.length+')',`<table class="cmp"><tbody>${I.bad.map(x=>`<tr><td>${esc(cLabel(x.u.c))}</td><td>${esc(x.u.u)}</td><td>${esc(x.f.f)}</td><td>عطل ${fromISO(x.f.d)}</td><td>إصلاح ${fromISO(x.f.fd)}</td></tr>`).join('')}</tbody></table>`)}
 ${sec(!I.nocode.length,'وحدات بدون كود ('+I.nocode.length+')',`<table class="cmp"><tbody>${I.nocode.map(x=>`<tr><td>${esc(cLabel(x.u.c))}</td><td><b>${esc(x.u.u)}</b></td><td><input placeholder="الكود" onchange="qaCode(${x.i},this.value)"></td></tr>`).join('')}</tbody></table>`)}
 ${sec(!I.dup.length,'أكواد مكررة داخل نفس العيادة ('+I.dup.length+')',`<table class="cmp"><tbody>${I.dup.map(v=>v.map((x,k)=>`<tr><td>${k?'':esc(cLabel(x.u.c))}</td><td><b>${esc(x.u.u)}</b></td><td><input value="${esc(x.u.code)}" onchange="qaCode(${x.i},this.value)"></td></tr>`).join('')).join('')}</tbody></table>`,'غالبًا خطأ نسخ. لو الكود فعلًا مشترك سيبه.')}
 ${sec(!I.nosev.length,'أعطال في الفهرس بدون أولوية ('+I.nosev.length+')',`<table class="cmp"><tbody>${I.nosev.map(x=>`<tr><td>${esc(x.c.fault)}</td><td><select onchange="S.cat[${x.i}].sev=+this.value;save();rQA()">${[3,2,1,0].map(k=>`<option value="${k}" ${(x.c.sev||0)===k?'selected':''}>${SEV[k][0]}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table>`)}
 ${sec(!I.un.length,'وحدات لم تُفحص ('+I.un.length+') — معلومة وليست خطأ',`<table class="cmp"><tbody>${[...new Set(I.un.map(x=>x.u.c))].map(c=>`<tr><td><b>${esc(cLabel(c))}</b></td><td>${I.un.filter(x=>x.u.c===c).length} وحدة</td><td><button class="btn s sm" onclick="ui.fc='${c}';go('quick')">⚡ افتح الإدخال السريع</button></td></tr>`).join('')}</tbody></table>`)}`}

function repairTbl(us,all){
 const rs=[];us.forEach(u=>u.faults.forEach(f=>{const fx=fixDay(u,f),d=fDay(u,f);if(f.fixed&&fx&&d)rs.push({c:u.c,f:f.f,days:Math.max(0,dDiff(d,fx))})}));
 if(!rs.length)return '<p class="hint">مفيش أعطال متصلّحة بتواريخ لحد دلوقتي. لما تعلّم عطل «تم الإصلاح» بيتسجّل له تاريخ الإصلاح، وتقدر تعدّله من نافذة الوحدة.</p>';
 const grp=(key)=>{const m=new Map();rs.forEach(r=>{const k=key(r),e=m.get(k)||{n:0,s:0,mn:1e9,mx:0};e.n++;e.s+=r.days;e.mn=Math.min(e.mn,r.days);e.mx=Math.max(e.mx,r.days);m.set(k,e)});return [...m.entries()].sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n)};
 const tb=(rows,h)=>`<table class="cmp big"><thead><tr><th>${h}</th><th>عدد الأعطال المصلَحة</th><th>متوسط الأيام</th><th>أقل</th><th>أكبر</th></tr></thead><tbody>${rows.map(([k,e],i)=>`<tr class="${i%2?'z':''}"><td class="r">${esc(k)}</td><td>${e.n}</td><td><b>${(e.s/e.n).toFixed(1)}</b></td><td>${e.mn}</td><td>${e.mx}</td></tr>`).join('')}</tbody></table>`;
 const tot=rs.reduce((a,r)=>a+r.days,0)/rs.length;
 return `<p>متوسط زمن الإصلاح العام: <b>${tot.toFixed(1)} يوم</b> (${rs.length} عطل)</p><h3>حسب العيادة</h3>${tb(grp(r=>cLabel(r.c)),'العيادة')}<h3 style="margin-top:12px">حسب نوع العطل</h3>${tb(grp(r=>r.f),'العطل')}`}
function readyAt(us,T){let a=0;us.forEach(u=>{if(!u.faults.length){if(u.ok)a++;return}const act=u.faults.filter(f=>fDay(u,f)<=T);if(!act.length){a++;return}if(act.every(f=>f.fixed&&(fixDay(u,f)||T)<=T))a++});return us.length?Math.round(a/us.length*100):0}
function readyMonths(){

 if(!ds.length)return '<p class="hint">مفيش تواريخ أعطال.</p>';
 const mn=ds.sort()[0].slice(0,7),now=todayISO().slice(0,7);let ms=[],[y,m]=mn.split('-').map(Number);
 while(true){const k=y+'-'+String(m).padStart(2,'0');ms.push(k);if(k>=now)break;m++;if(m>12){m=1;y++}if(ms.length>24)break}
 ms=ms.slice(-12);
 const eom=k=>{const [yy,mm]=k.split('-').map(Number);const e=new Date(Date.UTC(yy,mm,0)).toISOString().slice(0,10);return e>todayISO()?todayISO():e};
 const mname=k=>{const [yy,mm]=k.split('-');return ['','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'][+mm]+' '+yy};
 const rows=S.clinics.map(c=>({id:c.id,v:ms.map(k=>readyAt(S.units.filter(u=>u.c===c.id),eom(k)))}));
 const all=ms.map(k=>readyAt(S.units,eom(k)));
 const col=v=>v>=90?'#1f9d55':v>=60?'#e8862a':'#b03040';
 return `<table class="cmp big"><thead><tr><th>العيادة</th>${ms.map(k=>`<th>${esc(mname(k))}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i%2?'z':''}"><td><b>${esc(cLabel(r.id))}</b></td>${r.v.map(v=>`<td style="color:${col(v)};font-weight:700">${v}%</td>`).join('')}</tr>`).join('')}<tr><td><b>الكل</b></td>${all.map(v=>`<td style="color:${col(v)};font-weight:700">${v}%</td>`).join('')}</tr></tbody></table>
 <p class="hint">الجاهزية في آخر كل شهر = الوحدات اللي كل أعطالها المسجّلة لحد التاريخ ده اتصلّحت (أو سليمة) ÷ إجمالي الوحدات. بتعتمد على تاريخ العطل وتاريخ الإصلاح. الفلتر الزمني مش بيأثر هنا.</p>`}

const normF=s=>String(s==null?'':s).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[()\-_\/.,،:;]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
function mapFault(name,part,code,req,notes){
 const n=String(name).replace(/\s+/g,' ').trim();

 <div class="row" style="margin-top:8px"><input id="fbem" type="email" placeholder="الإيميل" value="${esc(em)}" style="direction:ltr" oninput="fbRules()"><input id="fbpw" type="password" placeholder="الباسورد" style="direction:ltr"><button class="btn" onclick="fbConnect()">اتصال</button></div>
 <p class="hint">الباسورد مش بيتخزّن في الملف — Firebase بيفتكر تسجيل الدخول على الجهاز. كرّر نفس الخطوات (لصق الإعدادات + الدخول) مرة واحدة على كل جهاز.</p>`;
 fbRules();$('modal').classList.add('on')}
function fbRules(){const e=($('fbem')?.value||'ايميلك@gmail.com').trim();const el=$('fbrules');if(el)el.textContent=`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{db}/documents {\n    match /fue/{doc} {\n      allow read, write: if request.auth != null\n        && request.auth.token.email == '${e}';\n    }\n  }\n}`}
async function fbConnect(){
 const cfg=fbParse($('fbcfg').value||'')||(FB.cfg&&FB.cfg.config);const email=$('fbem').value.trim(),pw=$('fbpw').value;
 if(!cfg){alert('مش قادر أقرأ إعدادات Firebase — الصق الكود كامل (apiKey, projectId, appId).');return}
 if(!email||!pw){alert('اكتب الإيميل والباسورد');return}
 FB.cfg={config:cfg,email};try{localStorage.setItem(FB_KEY,JSON.stringify(FB.cfg))}catch(e){}
 fbSet('connecting');
 try{await fbInit(true);if(!FB.auth)return;await FB.auth.signInWithEmailAndPassword(email,pw);$('modal').classList.remove('on')}
 catch(e){const m={'auth/invalid-credential':'الإيميل أو الباسورد غلط (أو المستخدم مش مضاف في Authentication).','auth/invalid-api-key':'apiKey غلط.','auth/network-request-failed':'مفيش إنترنت.'}[e.code]||e.message;fbSet('login',m);alert(m)}}
async function fbSignOut(){if(!confirm('فصل المزامنة على الجهاز ده؟ بياناتك المحلية هتفضل زي ما هي.'))return;
 try{if(FB.unsub)FB.unsub();await FB.auth.signOut()}catch(e){}FB.cfg=null;FB.user=null;FB.ref=null;try{localStorage.removeItem(FB_KEY)}catch(e){}fbSet('off');closeM()}
function fbClick(){if(!FB.cfg)fbSetup();else if(FB.st==='login'||FB.st==='error'&&!FB.user){fbSetup()}else fbSetup()}

if(FRESH&&!S.synced)S.mod=0;
draw();fbInit(false);
</script>
</body></html>
